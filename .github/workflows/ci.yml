name: Reproducibility smoke checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Verify pinned upstream source
        run: python scripts/fetch_upstream.py
      - name: Test invariants
        run: OPENBLAS_NUM_THREADS=1 python -m pytest -q --junitxml=reports/ci-tests.xml
      - name: End-to-end smoke (not a scientific performance run)
        run: bash scripts/run_smoke.sh runs/ci_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproducibility-smoke-evidence
          path: |
            reports/ci-tests.xml
            runs/ci_smoke/**/*.json
            runs/ci_smoke/**/*.jsonl
            runs/ci_smoke/**/*.csv
          retention-days: 14
